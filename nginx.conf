server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Seguridad básica
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    # Healthcheck para Coolify / balanceadores
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Soporte para URLs sin extensión .html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Cache de estáticos
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # Página 404 propia
    error_page 404 /404.html;
    location = /404.html { internal; }
}
